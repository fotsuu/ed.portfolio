<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Design Preview — Eric.dev Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080b11;
      --bg-1: #0d1117;
      --bg-2: #111820;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #22d3ee;
      --green: #10b981;
      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: #111827;
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 15px;
    }
    .title-group h1 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
    }
    .title-group p {
      font-size: 0.78rem;
      color: var(--text-3);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tab-btn {
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: rgba(34, 211, 238, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .action-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn:hover {
      background: #67e8f9;
      transform: translateY(-1px);
    }
    .action-btn.secondary {
      background: var(--bg-2);
      color: var(--text-1);
      border: 1px solid var(--border);
    }
    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .main-stage {
      flex: 1;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 10%, rgba(34, 211, 238, 0.04) 0%, transparent 60%);
    }
    .preview-frame-wrap {
      width: 100%;
      max-width: 680px;
      background: #05070a;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }
    .window-header {
      background: #0a0e14;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .window-dots {
      display: flex;
      gap: 6px;
    }
    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }
    .window-title {
      font-size: 0.75rem;
      color: var(--text-3);
      font-family: var(--font-mono);
    }
    .window-spacer {
      width: 40px;
    }
    iframe {
      width: 100%;
      height: 640px;
      border: none;
      display: block;
      background: #080b11;
    }
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }
    .toast-popup.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-badge">E</div>
      <div class="title-group">
        <h1>Email UI Design Preview</h1>
        <p>Portfolio-branded dark templates matching Eric's visual identity</p>
      </div>
    </div>

    <div class="controls">
      <button class="tab-btn active" id="tabInbound" onclick="switchTemplate('email-template.html', this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Incoming Inquiry (To Eric)
      </button>
      <button class="tab-btn" id="tabAutoReply" onclick="switchTemplate('email-autoreply-template.html', this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
        Confirmation (To Sender)
      </button>
      <button class="action-btn" onclick="copyCurrentCode()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy HTML for EmailJS
      </button>
      <a href="index.html#contact" class="action-btn secondary">
        Back to Portfolio
      </a>
    </div>
  </header>

  <main class="main-stage">
    <div class="preview-frame-wrap">
      <div class="window-header">
        <div class="window-dots">
          <div class="window-dot dot-red"></div>
          <div class="window-dot dot-yellow"></div>
          <div class="window-dot dot-green"></div>
        </div>
        <div class="window-title" id="previewTitle">email-template.html — 600px Responsive Viewport</div>
        <div class="window-spacer"></div>
      </div>
      <iframe id="previewIframe" src="email-template.html" title="Email Template Preview"></iframe>
    </div>
  </main>

  <div id="toastPopup" class="toast-popup">Copied email HTML template to clipboard!</div>

  <script>
    let currentFile = 'email-template.html';

    function switchTemplate(file, btn) {
      currentFile = file;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('previewIframe').src = file;
      document.getElementById('previewTitle').textContent = file + ' — 600px Responsive Viewport';
    }

    async function copyCurrentCode() {
      try {
        const res = await fetch(currentFile);
        const text = await res.text();
        await navigator.clipboard.writeText(text);
        showToast('✓ ' + currentFile + ' copied to clipboard! Paste into EmailJS template editor.');
      } catch (err) {
        showToast('Error copying code: ' + err.message);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastPopup');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
